# File Copier Configuration

# copyExisting = true
# Set to false if you only want files copied into new worlds, not existing ones.
copyExisting=true

# ===========================================
# FOLDER STRUCTURE
# ===========================================
#
# config/copy/
#   ├── datapacks/           <- Datapacks here are loaded BEFORE world generation!
#   │   ├── my_datapack/     <- These affect terrain generation at spawn
#   │   │   ├── pack.mcmeta
#   │   │   └── data/
#   │   └── another.zip
#   │
#   └── (other files)        <- Copied into world folder after creation
#
# IMPORTANT: Datapacks that modify terrain generation (custom biomes, structures,
# worldgen features) should be placed in config/copy/datapacks/ to ensure they
# affect the spawn area and all generated terrain from the start.
