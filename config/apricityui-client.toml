
[debug]
	#Enable dev auto-reload when local files change.
	autoReload = true
	#Enable AI helper screenshots (1 per second, keep latest 3) under screenshots/aui.
	aiAutoScreenshot = true
	#Show the AUI per-frame timing monitor in the top-left corner.
	frameTimingHud = false
	#Enable the loopback-only Apricity external debugger on port 25321.
	remoteDebug = false

[input]
	#Allow Ctrl+mouse-wheel viewport zoom to pass through persistent overlays that do not intercept mouse events.
	viewportZoomPassThrough = true
	#When the game hides the mouse cursor (crosshair mode), overlay and screen documents receive no mouse events. World windows are unaffected.
	blockMouseEventsWhenCursorHidden = true

[worldWindow]
	#Scale applied to WorldWindow's distance-based depth offset.
	#Range: 0.0 ~ 1.0
	depthOffsetScale = 0.01
	#Default maximum camera distance for WorldWindow rendering and interaction. Integer.MAX_VALUE means unlimited.
	#Range: > 0
	maxDisplayDistance = 128
	#Enable distance-based level-of-detail rendering for WorldWindow by default.
	lodEnabled = false
	#WorldWindow distance up to which automatic LOD keeps full detail.
	#Range: > 0
	fullDetailDistance = 16
	#WorldWindow distance up to which automatic LOD keeps reduced detail.
	#Range: > 0
	reducedDetailDistance = 48

[layout]
	#Slice the first full geometry commit across frames within a per-frame time budget instead of committing everything in one go.
	initialCommitSliceEnabled = true
	#Per-frame time budget in milliseconds for the sliced first full geometry commit. Only an upper bound; at least one element is always committed per frame.
	#Range: 0.5 ~ 64.0
	initialCommitSliceMs = 16.0

