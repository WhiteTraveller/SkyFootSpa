<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="aui-font-mode" content="web">
  <meta name="aui-viewport" content="mode=browser">
</head>
<body>
  <div class="stamina-hud">
    <span class="stamina-label">⚡ 体力</span>
    <span class="bar-bg">
      <span class="bar-fill" id="staminaFill"></span>
    </span>
    <span class="stamina-text" id="staminaText">10000/10000</span>
  </div>
</body>

<style>
  html, body {
    image-rendering: pixelated;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    /* 跨 Document 层级按根节点/body 的 translateZ 排序（大的靠前，z-index 管不了跨文档）；
       -1000 与 tooltip.html 的 +1000 对称，保证本 HUD 在所有 AUI 页面最底层 */
    transform: translateZ(-1000px);
  }

  .stamina-hud {
    position: fixed;
    left: 14px;
    bottom: 14px;
    width: 285px;
    height: 28px;
    background-image: url('stamina_bg_s.png');
    background-repeat: no-repeat;
    background-size: 100% 100%;
    z-index: -1;
  }

  .stamina-label {
    position: absolute;
    left: 28px;
    top: 10px;
    height: 12px;
    line-height: 12px;
    font-size: 10px;
    color: #8e3212;
    white-space: nowrap;
  }

  .bar-bg {
    position: absolute;
    left: 66px;
    top: 8px;
    width: 112px;
    height: 12px;
    background-color: rgba(142, 50, 18, 0.2);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    position: absolute;
    left: 0;
    top: 0;
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #ff8800, #ffcc00);
    border-radius: 3px;
    transition: width 0.05s linear;
  }

  .bar-fill.low {
    background: linear-gradient(90deg, #ff2222, #ff6644);
  }

  .bar-fill.mid {
    background: linear-gradient(90deg, #ff8800, #ffcc00);
  }

  .bar-fill.high {
    background: linear-gradient(90deg, #44dd44, #88ff44);
  }

  .stamina-text {
    position: absolute;
    right: 28px;
    top: 10px;
    height: 12px;
    line-height: 12px;
    font-size: 10px;
    color: #8e3212;
    white-space: nowrap;
  }
</style>
</html>
