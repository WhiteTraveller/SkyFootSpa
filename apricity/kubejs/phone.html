<script>
  var McClient = Java.loadClass("net.minecraft.client.Minecraft");

  // ===== 十二时辰映射 =====
  var SHICHEN = [
    "子时",
    "丑时",
    "丑时",
    "寅时",
    "寅时",
    "卯时",
    "卯时",
    "辰时",
    "辰时",
    "巳时",
    "巳时",
    "午时",
    "午时",
    "未时",
    "未时",
    "申时",
    "申时",
    "酉时",
    "酉时",
    "戌时",
    "戌时",
    "亥时",
    "亥时",
    "子时",
  ];

  // ===== 动态时间更新 =====
  function updateMcTime() {
    try {
      var mc = McClient.getInstance();
      if (!mc || !mc.level) return;
      var dayTime = mc.level.getDayTime() % 24000;
      var hour = Math.floor((dayTime / 1000 + 6) % 24);
      var minute = Math.floor(((dayTime % 1000) / 1000) * 60);
      var timeStr =
        (hour < 10 ? "0" : "") + hour + ":" + (minute < 10 ? "0" : "") + minute;
      var traditional = SHICHEN[hour];

      var statusLeft = document.querySelector(".status-left");
      var timeMain = document.querySelector(".time-main");
      var timeTraditional = document.querySelector(".time-traditional");
      if (statusLeft) statusLeft.innerText = timeStr;
      if (timeMain) timeMain.innerText = timeStr;
      if (timeTraditional) timeTraditional.innerText = traditional;
    } catch (e) {
      console.log("[PHONE] 时间更新失败: " + e);
    }
  }

  // 立即更新一次，然后每秒更新
  updateMcTime();
  window.setInterval(updateMcTime, 1000);

  // ===== 泡脚开关 =====
  var soakSkipped = 0; // 本地状态：0=泡脚开启, 1=跳过泡脚

  // 尝试从 global.pfPhoneSettings 读取初始状态
  function initSoakToggle() {
    try {
      if (typeof global !== "undefined" && global.pfPhoneSettings) {
        soakSkipped = global.pfPhoneSettings.pfSkipSoak || 0;
      }
    } catch (e) {}
    updateSoakToggleUI();
  }

  function updateSoakToggleUI() {
    var icon = document.querySelector("#soakToggleIcon");
    var label = document.querySelector("#soakToggleLabel");
    if (icon && label) {
      if (soakSkipped === 1) {
        icon.setAttribute("class", "icon red-icon");
        label.innerText = "泡脚:关";
      } else {
        icon.setAttribute("class", "icon green-icon");
        label.innerText = "泡脚:开";
      }
    }
  }

  // 点击切换
  var soakToggleBtn = document.querySelector("#appSoakToggle");
  if (soakToggleBtn) {
    soakToggleBtn.addEventListener("mousedown", function () {
      soakSkipped = soakSkipped === 1 ? 0 : 1;
      updateSoakToggleUI();
      // 发送到服务端
      try {
        var player = McClient.getInstance().player;
        if (player) {
          player.sendData("phone_set_setting", {
            key: "pfSkipSoak",
            value: soakSkipped,
          });
        }
      } catch (e) {
        console.log("[PHONE] 发送设置失败: " + e);
      }
    });
  }

  // 延迟初始化，等待服务端同步数据到达
  window.setTimeout(function () {
    initSoakToggle();
    initOneClickToggle();
    initHudToggle();
  }, 500);

  // ===== 一键满足开关 =====
  var oneClickEnabled = 0;

  function initOneClickToggle() {
    try {
      if (typeof global !== "undefined" && global.pfPhoneSettings) {
        oneClickEnabled = global.pfPhoneSettings.pfOneClickSatisfy || 0;
      }
    } catch (e) {}
    updateOneClickUI();
  }

  function updateOneClickUI() {
    var icon = document.querySelector("#oneClickIcon");
    var label = document.querySelector("#oneClickLabel");
    if (icon && label) {
      if (oneClickEnabled === 1) {
        icon.setAttribute("class", "icon green-icon");
        label.innerText = "秒搞:开";
      } else {
        icon.setAttribute("class", "icon dark-icon");
        label.innerText = "秒搞:关";
      }
    }
  }

  var oneClickBtn = document.querySelector("#appOneClick");
  if (oneClickBtn) {
    oneClickBtn.addEventListener("mousedown", function () {
      oneClickEnabled = oneClickEnabled === 1 ? 0 : 1;
      updateOneClickUI();
      try {
        var player = McClient.getInstance().player;
        if (player) {
          player.sendData("phone_set_setting", {
            key: "pfOneClickSatisfy",
            value: oneClickEnabled,
          });
        }
      } catch (e) {
        console.log("[PHONE] 发送设置失败: " + e);
      }
    });
  }

  // ===== 清除所有WorldWindow =====
  var WorldWindow = Java.loadClass("com.sighs.apricityui.world.WorldWindow");
  var clearUIBtn = document.querySelector("#appClearUI");
  if (clearUIBtn) {
    clearUIBtn.addEventListener("mousedown", function () {
      try {
        WorldWindow.clear();
        console.log("[PHONE] 已清除所有WorldWindow");
      } catch (e) {
        console.log("[PHONE] 清除WorldWindow失败: " + e);
      }
    });
  }

  // ===== 体力HUD开关 =====
  var ApricityUIRef = Java.loadClass("com.sighs.apricityui.ApricityUI");
  var hudVisible = 1;

  function initHudToggle() {
    try {
      if (typeof global !== "undefined" && global.pfStaminaHudVisible !== undefined) {
        hudVisible = global.pfStaminaHudVisible;
      }
    } catch (e) {}
    updateHudToggleUI();
  }

  function updateHudToggleUI() {
    var icon = document.querySelector("#appHideHud .icon");
    var label = document.querySelector("#appHideHud .app-name");
    if (!icon || !label) return;
    if (hudVisible === 1) {
      icon.setAttribute("class", "icon gray-icon");
      label.innerText = "体力HUD";
    } else {
      icon.setAttribute("class", "icon dark-icon");
      label.innerText = "HUD:关";
    }
  }

  var hideHudBtn = document.querySelector("#appHideHud");
  if (hideHudBtn) {
    hideHudBtn.addEventListener("mousedown", function () {
      hudVisible = hudVisible === 1 ? 0 : 1;
      try {
        if (typeof global !== "undefined") {
          global.pfStaminaHudVisible = hudVisible;
        }
        if (hudVisible === 0) {
          ApricityUIRef.removeDocument("kubejs/stamina_hud.html");
        }
        updateHudToggleUI();
        console.log("[PHONE] 体力HUD显示状态=" + hudVisible);
      } catch (e) {
        console.log("[PHONE] 切换体力HUD失败: " + e);
      }
    });
  }

  // ===== 评价按钮 =====
  var ratingBtn = document.querySelector("#appRatings");
  var ratingOverlay = document.querySelector("#ratingOverlay");
  var ratingClose = document.querySelector("#ratingClose");
  var ratingVisible = false;
  var ratingAnimVer = 0;

  // 6行静态元素引用
  var ratingBars = [];
  var ratingVals = [];
  for (var i = 0; i < 6; i++) {
    ratingBars.push(document.querySelector("#ratingBar" + i));
    ratingVals.push(document.querySelector("#ratingVal" + i));
  }
  // 顶部评分元素
  var rtStars = document.querySelector("#rtStars");
  var rtAvgScore = document.querySelector("#rtAvgScore");

  function showOverlay() {
    if (!ratingOverlay) return;
    ratingVisible = true;
    ratingAnimVer++;
    var myVer = ratingAnimVer;
    var duration = 220;
    var frameInterval = 16;
    var totalFrames = duration / frameInterval;
    var currentFrame = 0;
    var startTop = 0;
    var endTop = 0;
    // 初始帧立即应用起始状态，避免首帧跳变
      ratingOverlay.setAttribute(
      "style",
      "top: " + startTop + "px; left: 0px; opacity: 0; pointer-events: auto; z-index: 80;"
    );
    window.setInterval(function () {
      // 版本号失效或已隐藏则空转退出
      if (myVer !== ratingAnimVer || !ratingVisible) return;
      currentFrame++;
      var progress = currentFrame / totalFrames;
      if (progress >= 1) {
        progress = 1;
        ratingAnimVer++; // 让本定时器后续调用失效
      }
      var eased = 1 - Math.pow(1 - progress, 3);
      var top = startTop + (endTop - startTop) * eased;
      var op = eased;
      ratingOverlay.setAttribute(
        "style",
        "top: " + Math.round(top) + "px; left: 0px; opacity: " + op.toFixed(2) + "; pointer-events: auto; z-index: 80;"
      );
    }, frameInterval);
  }

  function hideOverlay() {
    if (!ratingOverlay) return;
    ratingAnimVer++; // 让进行中动画失效
    ratingOverlay.setAttribute("style", "top: -9999px; left: -9999px; opacity: 0; pointer-events: none;");
    ratingVisible = false;
  }

  // 更新第i行的进度条和数值
  function updateRatingRow(idx, rating) {
    var pct = Math.round(rating);
    if (ratingBars[idx]) {
      ratingBars[idx].setAttribute("style", "width:" + pct + "%;");
    }
    if (ratingVals[idx]) {
      ratingVals[idx].innerText = "" + rating;
    }
  }

  // 更新顶部综合评分
  function updateAvgScore(ratings) {
    var total = 0;
    for (var i = 0; i < ratings.length; i++) {
      total = total + ratings[i];
    }
    var avg = total / ratings.length;
    var score5 = (avg / 100) * 5;
    var scoreStr = score5.toFixed(1);
    if (rtAvgScore) rtAvgScore.innerText = scoreStr;
    if (rtStars) {
      var fullStars = Math.floor(score5);
      var halfStar = (score5 - fullStars) >= 0.5 ? 1 : 0;
      var emptyStars = 5 - fullStars - halfStar;
      var starStr = "";
      for (var s = 0; s < fullStars; s++) starStr = starStr + "\u2605";
      if (halfStar) starStr = starStr + "\u2606";
      for (var e = 0; e < emptyStars; e++) starStr = starStr + "\u2606";
      rtStars.innerText = starStr;
    }
  }

  function showRatings() {
    showOverlay();
    // 请求服务端真实数据
    try {
      var player = McClient.getInstance().player;
      if (player) {
        player.sendData("phone_get_ratings", {});
      }
    } catch (e) {
      console.log("[PHONE] 请求评价数据失败: " + e);
    }
    // 轮询等待真实数据到达后刷新
    var pollCount = 0;
    var pollDone = false;
    window.setInterval(function () {
      if (pollDone) return;
      pollCount++;
      if (pollCount > 30) {
        pollDone = true;
        return;
      }
      if (
        typeof global !== "undefined" &&
        global.pfPhoneSettings &&
        global.pfPhoneSettings.ratings
      ) {
        pollDone = true;
        var data = global.pfPhoneSettings.ratings;
        global.pfPhoneSettings.ratings = null;
        if (ratingVisible) {
          var nums = [];
          for (var j = 0; j < data.length && j < 6; j++) {
            updateRatingRow(j, data[j].rating);
            nums.push(data[j].rating);
          }
          updateAvgScore(nums);
        }
      }
    }, 100);
  }

  if (ratingBtn) {
    ratingBtn.addEventListener("mousedown", function () {
      if (ratingVisible) {
        hideOverlay();
      } else {
        if (gachaVisible) hideGacha();
        showRatings();
      }
    });
  }
  if (ratingClose) {
    ratingClose.addEventListener("mousedown", function () {
      hideOverlay();
    });
  }

  // ===== 抽卡弹窗 =====
  var gachaBtn = document.querySelector("#appGacha");
  var gachaOverlay = document.querySelector("#gachaOverlay");
  var gachaClose = document.querySelector("#gachaClose");
  var gachaVisible = false;
  var gachaAnimVer = 0;

  function showGacha() {
    if (!gachaOverlay) return;
    gachaVisible = true;
    gachaAnimVer++;
    var myVer = gachaAnimVer;
    var duration = 220;
    var frameInterval = 16;
    var totalFrames = duration / frameInterval;
    var currentFrame = 0;
    var startTop = 0;
    var endTop = 0;
    gachaOverlay.setAttribute(
      "style",
      "top: " + startTop + "px; left: 0px; opacity: 0; pointer-events: auto; z-index: 80;"
    );
    window.setInterval(function () {
      if (myVer !== gachaAnimVer || !gachaVisible) return;
      currentFrame++;
      var progress = currentFrame / totalFrames;
      if (progress >= 1) {
        progress = 1;
        gachaAnimVer++;
      }
      var eased = 1 - Math.pow(1 - progress, 3);
      var top = startTop + (endTop - startTop) * eased;
      var op = eased;
      gachaOverlay.setAttribute(
        "style",
        "top: " + Math.round(top) + "px; left: 0px; opacity: " + op.toFixed(2) + "; pointer-events: auto; z-index: 80;"
      );
    }, frameInterval);
  }

  function hideGacha() {
    if (!gachaOverlay) return;
    gachaAnimVer++;
    gachaOverlay.setAttribute("style", "top: -9999px; left: -9999px; opacity: 0; pointer-events: none;");
    gachaVisible = false;
  }

  if (gachaBtn) {
    gachaBtn.addEventListener("mousedown", function () {
      if (gachaVisible) {
        hideGacha();
      } else {
        // 如果评价弹窗开着，先关掉
        if (ratingVisible) hideOverlay();
        showGacha();
      }
    });
  }
  if (gachaClose) {
    gachaClose.addEventListener("mousedown", function () {
      hideGacha();
    });
  }

  // 抽卡按钮（预留，暂时打印日志）
  var gachaPull1 = document.querySelector("#gachaPull1");
  var gachaPull10 = document.querySelector("#gachaPull10");
  if (gachaPull1) {
    gachaPull1.addEventListener("mousedown", function () {
      console.log("[PHONE] 一回抽卡");
      try {
        var player = McClient.getInstance().player;
        if (player) {
          player.sendData("phone_gacha_pull", { count: 1 });
        }
      } catch (e) {
        console.log("[PHONE] 抽卡失败: " + e);
      }
    });
  }
  if (gachaPull10) {
    gachaPull10.addEventListener("mousedown", function () {
      console.log("[PHONE] 十回抽卡");
      try {
        var player = McClient.getInstance().player;
        if (player) {
          player.sendData("phone_gacha_pull", { count: 10 });
        }
      } catch (e) {
        console.log("[PHONE] 抽卡失败: " + e);
      }
    });
  }

  // ===== 滑入动画 =====
  var wrapper = document.querySelector(".phone-wrapper");
  if (wrapper) {
    var duration = 300;
    var frameInterval = 16;
    var totalFrames = duration / frameInterval;
    var currentFrame = 0;
    var animDone = false;

    wrapper.setAttribute("style", "bottom: -230px");

    window.setInterval(function () {
      if (animDone) return;
      currentFrame++;
      var progress = currentFrame / totalFrames;
      if (progress >= 1) {
        progress = 1;
        animDone = true;
      }
      var eased = 1 - Math.pow(1 - progress, 3);
      var currentBottom = -230 + (10 - -230) * eased;
      wrapper.setAttribute(
        "style",
        "bottom: " + Math.round(currentBottom) + "px",
      );
    }, frameInterval);
  }
</script>
</html>
