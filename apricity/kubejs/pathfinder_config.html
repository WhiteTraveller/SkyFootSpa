<!--
  【窗口化版】AUI 1.2.3 + gui viewport
  在“坐标修复版”基础上，解决“界面占满整个屏幕”：
  - body 背景由不透明纯色 #1e293b 改为半透明暗遮罩 rgba(0,0,0,0.45)
    （像原版容器界面那样透出世界、不再实心糊满全屏；AUI 容器 Screen 自身不画暗背景，全靠 body）。
  - 中间内容用 .panel 面板包裹（半透明深色 + padding），让界面呈“窗口”状居中，而非铺满。
  - .panel 刻意不用 box-shadow / border-radius / border：gui 下复杂盒模型可能触发每帧重建 Document。

  保持之前的修复（勿改回）：
  - viewport=gui（坐标 1:1 映射菜单，配合极简 CSS 不触发重建循环）；
  - body flex column 居中；
  - #player 绝不设 display:grid / padding / border / background，全交给 preset:player（否则 hover 蒙层偏上）；
  - 不加 aui-mouse-events=intercept（会吞槽位点击）。
  ESC 关闭。服务端：menu(...).bind(b => b.saveddata(dataName,27).player())，1.2.3 下持久化正常。
-->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="aui-font-mode" content="web">
  <meta name="aui-viewport" content="mode=gui">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      color: #e2e8f0;
    }
    .panel {
      background: rgba(30, 41, 59, 0.9);
      padding: 12px 14px;
    }
    /* 只统一槽位尺寸，不在 container 上设 display，避免干扰 preset:player */
    container { --aui-slot-size: 20px; }
    /* 配置库存：手动 9x3 网格 */
    #saved_data {
      display: grid;
      grid-template-columns: repeat(9, 20px);
      gap: 2px;
      width: max-content;
    }
    /* 玩家背包：完全交给 layout="preset:player"，这里只留间距 */
    #player { margin-top: 10px; }
    .label { margin: 4px 0; font-size: 11px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="panel">
    <div class="label">配置物品 (saved_data x27)</div>
    <container id="saved_data" bind="saved_data" primary="true" size="27"></container>

    <div class="label">玩家背包</div>
    <container id="player" bind="player" layout="preset:player"></container>
  </div>
</body>
</html>
