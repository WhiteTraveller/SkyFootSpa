<body>
  <div class="foot-ui-container">
    <div class="up">
      <div class="header">
        <span class="title">需求清单</span>
      </div>
      <div class="requireList">
        <div class="left">
          <div class="footsole">
            <span class="label">脚掌：</span>
            <span class="count" id="countJiaozhang">2次</span>
          </div>
          <div class="footheart">
            <span class="label">脚心：</span>
            <span class="count" id="countJiaoxin">3次</span>
          </div>
        </div>
        <div class="right">
          <div class="toe">
            <span class="label">脚趾：</span>
            <span class="count" id="countJiaozhi">2次</span>
          </div>
                    <div class="heel">
            <span class="label">脚跟：</span>
            <span class="count" id="countJiaogen">1次</span>
          </div>
        </div>
      </div>
      <!-- 满意度和步骤 -->
      <div class="satisfaction">
          <span class="satisfaction-text">
            满意度:
          </span>
        <span class="progress-wrapper">
          <span class="progress-bg">
            <span class="progress-fill" id="satisfactionFill" style="width: 0%"></span>
          </span>
        </span>
        <span class="progress-percent" id="satisfactionPercent">0%</span>
      </div>

      <!-- 步骤记录 -->
      <div class="steps-container" id="stepsContainer">
        <span class="steps-label">已执行:</span>
        <span class="steps-text" id="stepsText"></span>
      </div>
    </div>

    <div class="down">
      <!-- 脚部位按钮4部位） -->
      <div class="btn-container">
        <div id="jiaozhi" class="jiaozhi box">脚趾</div>
        <div id="jiaozhang" class="jiaozhang box">脚掌</div>
        <div id="jiaoxin" class="jiaoxin box">脚心</div>
        <div id="jiaogen" class="jiaogen box">脚跟</div>
      </div>
    </div>
  </div>
</body>
<style>
  /* 主容器 */
  .foot-ui-container {
    position: relative;
    /* top: -100px; */
    width: 100px;
    display: flex;
    flex-direction: column;
  }

  .up {
    height: 70px;
    background: url('text.png') no-repeat center center;
  }

  .header {
    position: absolute;
    left: 30px;
    top: 8px;
    height: 11px;
    transform: translateZ(0.5px);
  }

  .title {
    color: #844c24;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 0px;
    line-height: 10.8px;
    text-align: left;
    vertical-align: top;
  }

  /* 需求列表 */
  .requireList {
    position: absolute;
    left: 10px;
    top: 12px;
    width: 100px;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    margin: 0 10px;
    margin-top: 8px;
    color: #844c24;
  }

  /* 需求项横向排布 */
  .footsole {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  .heel {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  .toe {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  .footheart {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  /* 需求标签样式 */
  .label {
    font-size: 14px;
    color: #844c24;
  }

  /* 次数样式 - 默认浅蓝色 */
  .count {
    font-size: 14px;
    color: #844c24;
  }

  /* 完成样式 - 绿色对号 */
  .count.done {
    color: #00FF00;
  }

  .left {
    width: 50%;
  }

  .right {
    width: 50%;
  }

  /* 满意度进度条 */
  .satisfaction {
    position: relative;
    left: 10px;
    top: 40px;
    display: flex;
    flex-direction: row;
  }

  .progress-wrapper {
    display: flex;
    flex-direction: row;
    align-items: center;
    font-size: 14px;
    font-family: monospace;
  }

  .progress-wrapper .text {
    color: #844c24;
  }

  /* 满意度横向条（仿泡脚条） */
  .progress-bg {
    position: relative;
    top: -1;
    width: 40px;
    height: 6px;
    background-color: rgba(80, 80, 80, 0.7);
    border-radius: 2px;
    overflow: hidden;
    margin-left: 2px;
  }

  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: #844c24;
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  .satisfaction-text {
    top: 4px;
    font-size: 14px;
    color: #844c24;
    margin-right: 2px;
  }

  .progress-percent {
    font-size: 14px;
    color: #844c24;
    margin-left: 2px;
  }

  /* 步骤记录容器 */
  .steps-container {
    position: absolute;
    left: 10px;
    top: 45px;
    margin: 0 10px;
    margin-top: 4px;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    max-width: 100px;
    word-wrap: break-word;
    word-break: break-all;
  }

  .steps-label {
    font-size: 12px;
    color: #844c24;
    white-space: nowrap;
    margin-right: 4px;
  }

  .steps-text {
    font-size: 12px;
    color: #844c24;
  }

  /* 脚部位按钮 */
  .btn-container {
    position: relative;
    width: 100px;
    height: 70px;
    background: url('text.png') no-repeat center center;
    margin: 0 10px;
    margin-top: 4px;

    color: #844c24;
    cursor: pointer;
    background-size: contain;
    background-position: center;
  }

  /* 按钮样式 */
  .box {
    position: absolute;
    width: 20px;
    height: 15px;
    border-radius: 2px;
    border: 1px solid #844c24;
    transform: translateZ(10px);
    background-size: contain;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 点击动画 - 缩小再放大 */
  .box:active {
    transform: scale(0.85);
  }

  /* 方案一（4部位）
     [脚掌]  [脚趾]
     [脚心]  [脚跟]
  */
  .btn-container .jiaozhang {
    top: 13px;
    left: 20px;
  }

  .btn-container .jiaozhi {
    top: 13px;
    left: 60px;
  }


  .btn-container .jiaoxin {
    top: 41px;
    left: 20px;
  }

  .btn-container .jiaogen {
    top: 41px;
    left: 60px;
  }

</style>
