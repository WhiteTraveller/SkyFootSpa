<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="aui-font-mode" content="web">
  <meta name="aui-viewport" content="mode=fixed,width=100,height=150">
</head>
<body>
  <div class="foot-ui-container">
    <div class="up">
      <div class="header">
        <span class="title" id="titleText">需求清单</span>
      </div>
      <div class="requireList">
        <div class="left">
          <div class="footsole">
            <span class="label" id="labelJiaozhang">推：</span>
            <span class="count" id="countJiaozhang">2次</span>
          </div>
          <div class="footheart">
            <span class="label" id="labelJiaoxin">搓：</span>
            <span class="count" id="countJiaoxin">3次</span>
          </div>
        </div>
        <div class="right">
          <div class="toe">
            <span class="label" id="labelJiaozhi">按：</span>
            <span class="count" id="countJiaozhi">2次</span>
          </div>
                    <div class="heel">
            <span class="label" id="labelJiaogen">揉：</span>
            <span class="count" id="countJiaogen">1次</span>
          </div>
        </div>
      </div>
      <!-- 满意度 -->
      <div class="satisfaction">
        <span class="satisfaction-text" id="satisfactionLabel">满意度:</span>
        <span class="progress-wrapper">
          <span class="progress-bg">
            <span class="progress-fill" id="satisfactionFill" style="width: 0%"></span>
          </span>
        </span>
        <span class="progress-percent" id="satisfactionPercent">0%</span>
      </div>
    </div>

    <!-- 茶水按钮：需求清单正下方，消耗手持已登记的茶水（foot_serve_food） -->
    <div id="serveFoodBtn" class="serve-food-btn">
      <span class="serve-food-text" id="serveFoodText">茶水</span>
    </div>

    <div class="down">
                  <!-- 拖动跟随物品图标：初始隐藏，由 JS 在拖动/缩放动画期间控制 -->
      <div id="floatAnim" class="float-anim" style="opacity: 0; left: -9999px;">
        <img id="floatImg" class="float-img" src="" />
      </div>
      <!-- 脚图片：手持不同物品点击 = 搓不同部位，服务端根据手持物品判断 -->
      <div id="footImage" class="foot-image">
        <img src="foot.png" class="foot-img" />
      </div>
    </div>
  </div>
</body>
<style>
  /* 需求清单字体：ZhaohuaMinB Black（同人物图鉴），@font-face 相对页面目录 */
  @font-face {
    font-family: FootZhaohua;
    src: url("fonts/zhaohua_minb_black.ttf") format("truetype");
  }

  /* 主容器 */
  html, body {
    image-rendering: crisp-edges;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  .foot-ui-container {
    position: relative;
    width: 100px;
    height: 200px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-sizing: border-box;
  }

  /* 需求清单底图：require_bg.png 去掉中间 44 行（原“已执行”一行）后的 400x236 版本 → 100x59 */
  .up {
    height: 59px;
    flex: 0 0 59px;
    overflow: hidden;
    background-image: url('require_bg_short.png');
    background-repeat: no-repeat;
    background-size: 100% 100%;
    position: relative;
    z-index: 2;
  }

  .header {
    position: absolute;
    left: 34px;
    top: 9px;
    height: 11px;
    transform: translateZ(0.5px);
  }

  .title {
    font-family: "FootZhaohua", "SimSun", serif;
    color: #844c24;
    font-size: 7px;
    font-weight: bold;
    letter-spacing: 0px;
    line-height: 1;
    text-align: left;
    vertical-align: top;
  }

  /* 需求列表 */
  .requireList {
    position: absolute;
    left: 8px;
    top: 22px;
    width: 84px;
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: flex-start;
    margin: 0;
    color: #844c24;
  }

  /* 需求项横向排布 */
  .footsole {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  .heel {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  .toe {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  .footheart {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  /* 需求标签样式 */
  .label {
    font-size: 6px;
    color: #844c24;
  }

  /* 次数样式 - 默认浅蓝色 */
  .count {
    font-size: 6px;
    color: #844c24;
  }

  /* 完成样式 - 绿色对号 */
  .count.done {
    color: #00FF00;
  }

  .left {
    width: 39px;
  }

  .right {
    width: 39px;
  }

  /* 满意度进度条 */
  .satisfaction {
    position: absolute;
    left: 8px;
    top: 43px;
    display: flex;
    flex-direction: row;
  }

  .progress-wrapper {
    display: flex;
    flex-direction: row;
    align-items: center;
    font-size: 6px;
    font-family: monospace;
  }

  .progress-wrapper .text {
    color: #844c24;
  }

  /* 满意度横向条（仿泡脚条） */
  .progress-bg {
    position: relative;
    top: -1px;
    width: 40px;
    height: 5px;
    background-color: rgba(80, 80, 80, 0.7);
    border-radius: 2px;
    overflow: hidden;
    margin-left: 2px;
  }

  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: #844c24;
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  .satisfaction-text {
    top: 4px;
    font-size: 6px;
    color: #844c24;
    margin-right: 2px;
  }

  .progress-percent {
    font-size: 6px;
    color: #844c24;
    margin-left: 2px;
  }

  /* 茶水按钮：背景为需求清单底图的顶部 40 行 + 底部 36 行拼接（serve_food_btn_bg.png，400x76 → 100x19） */
  .serve-food-btn {
    position: absolute;
    left: 0px;
    top: 61px;
    width: 100px;
    height: 19px;
    background-image: url('serve_food_btn_bg.png');
    background-repeat: no-repeat;
    background-size: 100% 100%;
    cursor: pointer;
    transform: translateZ(0px);
    z-index: 2;
  }

  .serve-food-btn:active {
    transform: scale(0.95) translateZ(0px);
  }

  .serve-food-text {
    position: absolute;
    left: 43px;
    top: 6px;
    font-size: 7px;
    line-height: 1;
    color: #844c24;
  }



  /* 拖动模式下不再使用 :active 缩放，避免触发 mouseleave */
  /* .foot-image:active {
    transform: scale(0.9);
  } */



  /* 拖动跟随物品图标：不受 .foot-image overflow 裁剪 */
  .down {
    margin-top: 66px;
    position: relative;
    flex: 0 0 100px;
    z-index: 1;
  }

  .float-anim {
    position: absolute;
    left: -9999px;
    top: 0;
    opacity: 0;
    z-index: 10;
    width: 100px;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform: translateZ(0px);
    pointer-events: none;
  }

  .float-img {
    width: 24px;
    height: 24px;
    pointer-events: none;
  }



  /* .btn-container:active {
    transform: scale(0.95);
  } */
</style>
<script>
  console.log("test.html loaded");
</script>
</html>
