<body>
  <div class="foot-ui-container">
    <!-- 送客按钮：右上角小按钮，点击后顾客直接起床（不结算、不发奖励） -->
    <div id="dismissBtn" class="dismiss-btn">送客</div>
    <div class="up">
      <div class="header">
        <span class="title">需求清单</span>
      </div>
      <div class="requireList">
        <div class="left">
          <div class="footsole">
            <span class="label">脚掌：</span>
            <span class="count" id="countJiaozhang">2次</span>
          </div>
          <div class="footheart">
            <span class="label">脚心：</span>
            <span class="count" id="countJiaoxin">3次</span>
          </div>
        </div>
        <div class="right">
          <div class="toe">
            <span class="label">脚趾：</span>
            <span class="count" id="countJiaozhi">2次</span>
          </div>
                    <div class="heel">
            <span class="label">脚跟：</span>
            <span class="count" id="countJiaogen">1次</span>
          </div>
        </div>
      </div>
      <!-- 满意度和步骤 -->
      <div class="satisfaction">
          <span class="satisfaction-text">
            满意度:
          </span>
        <span class="progress-wrapper">
          <span class="progress-bg">
            <span class="progress-fill" id="satisfactionFill" style="width: 0%"></span>
          </span>
        </span>
        <span class="progress-percent" id="satisfactionPercent">0%</span>
      </div>

      <!-- 步骤记录 -->
      <div class="steps-container" id="stepsContainer">
        <span class="steps-label">已执行:</span>
        <span class="steps-text" id="stepsText"></span>
      </div>
    </div>

    <div class="down">
                  <!-- 拖动跟随物品图标：初始隐藏，由 JS 在拖动/缩放动画期间控制 -->
      <div id="floatAnim" class="float-anim" style="opacity: 0; left: -9999px;">
        <img id="floatImg" class="float-img" src="" />
      </div>
      <!-- 脚图片：手持不同物品点击 = 搓不同部位，服务端根据手持物品判断 -->
      <div id="footImage" class="foot-image">
        <div class="foot-label">顾客的脚</div>
        <img src="foot.png" class="foot-img" />
      </div>
    </div>
  </div>
</body>
<style>
  /* 主容器 */
  .foot-ui-container {
    position: relative;
    /* top: -100px; */
    width: 100px;
    display: flex;
    flex-direction: column;
  }

  .up {
    height: 70px;
    background: url('text.png') no-repeat center center;
  }

  .header {
    position: absolute;
    left: 30px;
    top: 8px;
    height: 11px;
    transform: translateZ(0.5px);
  }

  .title {
    color: #844c24;
    font-size: 20px;
    font-weight: 400;
    letter-spacing: 0px;
    line-height: 10.8px;
    text-align: left;
    vertical-align: top;
  }

  /* 需求列表 */
  .requireList {
    position: absolute;
    left: 10px;
    top: 12px;
    width: 100px;
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
    margin: 0 10px;
    margin-top: 8px;
    color: #844c24;
  }

  /* 需求项横向排布 */
  .footsole {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  .heel {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  .toe {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  .footheart {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 0;
  }

  /* 需求标签样式 */
  .label {
    font-size: 14px;
    color: #844c24;
  }

  /* 次数样式 - 默认浅蓝色 */
  .count {
    font-size: 14px;
    color: #844c24;
  }

  /* 完成样式 - 绿色对号 */
  .count.done {
    color: #00FF00;
  }

  .left {
    width: 50%;
  }

  .right {
    width: 50%;
  }

  /* 满意度进度条 */
  .satisfaction {
    position: relative;
    left: 10px;
    top: 40px;
    display: flex;
    flex-direction: row;
  }

  .progress-wrapper {
    display: flex;
    flex-direction: row;
    align-items: center;
    font-size: 14px;
    font-family: monospace;
  }

  .progress-wrapper .text {
    color: #844c24;
  }

  /* 满意度横向条（仿泡脚条） */
  .progress-bg {
    position: relative;
    top: -1;
    width: 40px;
    height: 6px;
    background-color: rgba(80, 80, 80, 0.7);
    border-radius: 2px;
    overflow: hidden;
    margin-left: 2px;
  }

  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 0%;
    background: #844c24;
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  .satisfaction-text {
    top: 4px;
    font-size: 14px;
    color: #844c24;
    margin-right: 2px;
  }

  .progress-percent {
    font-size: 14px;
    color: #844c24;
    margin-left: 2px;
  }

  /* 步骤记录容器 */
  .steps-container {
    position: absolute;
    left: 10px;
    top: 45px;
    margin: 0 10px;
    margin-top: 4px;
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    max-width: 100px;
    word-wrap: break-word;
    word-break: break-all;
  }

  .steps-label {
    font-size: 12px;
    color: #844c24;
    white-space: nowrap;
    margin-right: 4px;
  }

  .steps-text {
    font-size: 12px;
    color: #844c24;
  }

  /* 送客按钮（尺寸小于部位按钮 20x15） */
  .dismiss-btn {
    position: absolute;
    top: 0px;
    right: 0px;
    padding-left: 2px;
    width: 10px;
    height: 9px;
    border-radius: 2px;
    border: 1px solid #844c24;
    background: rgba(255, 235, 200, 0.85);
    color: #844c24;
    font-size: 8px;
    font-weight: 400;
    text-align: center;
    line-height: 9px;
    cursor: pointer;
    transform: translateZ(0px);
    z-index: 0;
  }

  .dismiss-btn:active {
    transform: scale(0.85) translateZ(0px);
  }

  /* 脚图片区域 */
  .foot-image {
    position: relative;
    width: 93px;
    height: 50px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: flex-start;
    cursor: pointer;
    margin-top: 10px;
    transition: transform 0.08s ease;
    border: 1px solid #844c24;
    border-radius: 6px;
    background: rgba(231, 214, 188, 0.432);
    overflow: hidden;
    padding: 2px 4px;
  }

  /* 拖动模式下不再使用 :active 缩放，避免触发 mouseleave */
  /* .foot-image:active {
    transform: scale(0.9);
  } */

  .foot-img {
    margin-left: 21px;
    width: 53px;
    height: 29px;
    z-index: -10px;
    image-rendering: pixelated;
    align-self: center;
    margin-top: -2px;
    pointer-events: none;
  }

  .foot-label {
    font-size: 8px;
    color: #5a2e10;
    font-weight: bold;
    margin-left: 4px;
    text-shadow: 0 0 2px rgba(255, 248, 230, 0.8);
    pointer-events: none;
    letter-spacing: 0.5px;
    line-height: 10px;
  }

  /* 拖动跟随物品图标：不受 .foot-image overflow 裁剪 */
  .down {
    position: relative;
  }

  .float-anim {
    position: absolute;
    left: -9999px;
    top: 0;
    opacity: 0;
    z-index: 10;
    width: 100px;
    height: 100px;
    display: flex;
    justify-content: center;
    align-items: center;
    transform: translateZ(0px);
    pointer-events: none;
  }

  .float-img {
    width: 24px;
    height: 24px;
    image-rendering: pixelated;
    pointer-events: none;
  }



  /* .btn-container:active {
    transform: scale(0.95);
  } */
</style>
