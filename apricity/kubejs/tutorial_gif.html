<!DOCTYPE html>
<!--
  教学 GIF Overlay：全屏自适应播放指定 GIF，叠在当前 MC Screen（含 FTB Quests）之上。
  - 由 client_scripts/ui/tutorial_ui.js createDocument('kubejs/tutorial_gif.html') 打开
    + setReloadPersistent(true) 保证盖在 MC Screen 上
  - GIF 文件名由客户端脚本预先写入 global.pfTutorialGifName，本页脚本读取并设 src
  - 关闭：只保留右上 X 按钮（页面内 ApricityUI.removeDocument），不再响应 ESC
  - GIF 资源路径：apricity/kubejs/tutorials/<name>.gif
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="aui-font-mode" content="web">
  <meta name="aui-viewport" content="mode=browser">
  <meta name="aui-mouse-events" content="intercept">
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.85);
      image-rendering: pixelated;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }

    /* GIF 容器：铺满视口 + object-fit 保持宽高比居中（AUI 不支持 img 的 auto 固有尺寸，
       必须显式给 width/height，否则会被算成 0x0 不显示） */
    #gif {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      pointer-events: none;
    }

    /* 右上关闭按钮：固定定位，不随 gif 大小变化 */
    #closeBtn {
      position: absolute;
      top: 16px;
      right: 20px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      color: #ffffff;
      font-size: 24px;
      font-weight: bold;
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 6px;
      cursor: pointer;
      z-index: 9999;
      user-select: none;
    }
    #closeBtn:hover {
      background: rgba(200, 50, 50, 0.8);
      border-color: #ffffff;
    }

    /* 底部提示条 */
    #hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <!-- 关闭按钮 -->
  <div id="closeBtn" title="关闭">×</div>

  <!-- GIF 本体：src 由脚本动态填充 -->
  <img id="gif" alt="教学动画">

  <!-- 底部提示 -->
  <div id="hint">点击右上角 × 关闭</div>

  <script>
    var ApricityUI = Java.loadClass("com.sighs.apricityui.ApricityUI");

    // ===== 从 global 读 gif 名（客户端脚本 pf_play_tutorial 到达时已写入）=====
    function getGifSrc() {
      try {
        var name = String(global.pfTutorialGifName);
        if (!name || name === 'undefined') name = 'default';
        return 'tutorials/' + name + '.gif';
      } catch (e) {
        return 'tutorials/default.gif';
      }
    }

    // ===== 关闭 Overlay =====
    function closeOverlay() {
      try { ApricityUI.removeDocument('kubejs/tutorial_gif.html'); } catch (e) {}
    }

    // ===== 启动 =====
    document.addEventListener('DOMContentLoaded', function () {
      // 填充 GIF src
      document.getElementById('gif').setAttribute('src', getGifSrc());

      // X 按钮点击关闭
      document.getElementById('closeBtn').addEventListener('click', closeOverlay);
    });
  </script>
</body>
</html>
