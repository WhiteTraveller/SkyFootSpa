<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="aui-font-mode" content="web">
  <meta name="aui-viewport" content="mode=browser">
</head>
<body>
  <div id="tooltip">
    <div id="header">
        <span id="title"></span>
    </div>
    <div id="content">
      <div id="desc-area">
        <div id="main-desc">
            <span id="main-desc-text"></span>
        </div>
        <div id="sub-desc">
            <span id="sub-desc-text"></span>
        </div>
        <div id="story">
            <span id="story-text">
                
            </span>
        </div>
      </div>
      <div id="guide-area">
        <div id="guide-grid">
          <div class="gr"><div class="gc" id="guide-cell-0"></div><div class="gc" id="guide-cell-1"></div><div class="gc" id="guide-cell-2"></div><div class="gc" id="guide-cell-3"></div><div class="gc" id="guide-cell-4"></div></div>
          <div class="gr"><div class="gc" id="guide-cell-5"></div><div class="gc" id="guide-cell-6"></div><div class="gc" id="guide-cell-7"></div><div class="gc" id="guide-cell-8"></div><div class="gc" id="guide-cell-9"></div></div>
          <div class="gr"><div class="gc" id="guide-cell-10"></div><div class="gc" id="guide-cell-11"></div><div class="gc guide-center" id="guide-cell-12"></div><div class="gc" id="guide-cell-13"></div><div class="gc" id="guide-cell-14"></div></div>
          <div class="gr"><div class="gc" id="guide-cell-15"></div><div class="gc" id="guide-cell-16"></div><div class="gc" id="guide-cell-17"></div><div class="gc" id="guide-cell-18"></div><div class="gc" id="guide-cell-19"></div></div>
          <div class="gr"><div class="gc" id="guide-cell-20"></div><div class="gc" id="guide-cell-21"></div><div class="gc" id="guide-cell-22"></div><div class="gc" id="guide-cell-23"></div><div class="gc" id="guide-cell-24"></div></div>
        </div>
      </div>
    </div>
  </div>
</body>

<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    opacity: 1;
    pointer-events: none;
  }

  body.shown {
    animation: tooltip-fade-in 0.15s ease-out forwards;
  }

  body.hiding {
    animation: tooltip-fade-out 0.15s ease forwards;
  }

  @keyframes tooltip-fade-in {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }

  @keyframes tooltip-fade-out {
    0% {
      opacity: 1;
    }
    100% {
      opacity: 0;
    }
  }

  #tooltip {
    position: fixed;
    font-family: "default";
    font-size: 15px;
    transform: translateZ(1000px);
    min-width: 230px;
    max-width: 360px;
    margin-left: 11px;
  }

  #header {
    --red: rgb(142, 50, 50);
    --blue: rgb(193, 193, 193);
    --purple: rgb(163, 77, 132);
    --green: rgb(88, 149, 88);
    --gold: rgb(189, 180, 61);
    background-color: var(--gold);
    color: #fff;
    line-height: 18px;
    padding-left: 6px;
    padding-right: 6px;
    text-stroke: 2px #555;
    margin-bottom: 2px;
  }

  #content {
    background-color: rgba(0, 0, 0, 0.85);
    display: flex;
    flex-direction: row;
    padding: 7px;
  }

  #desc-area {
    display: flex;
    flex-direction: column;
    width: 125px;
    color: #ddd;
    text-stroke: 0px;
  }

  #main-desc {
    margin-bottom: 4px;
    line-height: 14px;
  }

  #sub-desc {
    line-height: 14px;
    color: #aaa;
  }

  #guide-area {
    padding-left: 8px;
    margin-left: 8px;
    display: flex;
    flex-direction: column;
  }

  #guide-grid {
    display: flex;
    flex-direction: column;
    border: 2px solid rgba(255, 255, 255, 0.6);
    border-radius: 4px;
    padding: 4px;
  }

  .gr {
    display: flex;
    flex-direction: row;
    margin-bottom: 3px;
  }

  .gr:last-child {
    margin-bottom: 0;
  }

  .gc {
    width: 14px;
    height: 14px;
    margin-right: 2px;
    background-color: rgba(255, 255, 255, 0.25);
    transform-origin: center;
    animation: gc-pop 0.2s ease-out forwards;
    transform: scale(0);
  }

  @keyframes gc-pop {
    0% {
      transform: scale(0);
    }
    100% {
      transform: scale(1);
    }
  }

  /* 对角线延迟：行+列 */
  .gr:nth-child(1) .gc:nth-child(1) { animation-delay: 0ms; }
  .gr:nth-child(1) .gc:nth-child(2), .gr:nth-child(2) .gc:nth-child(1) { animation-delay: 30ms; }
  .gr:nth-child(1) .gc:nth-child(3), .gr:nth-child(2) .gc:nth-child(2), .gr:nth-child(3) .gc:nth-child(1) { animation-delay: 60ms; }
  .gr:nth-child(1) .gc:nth-child(4), .gr:nth-child(2) .gc:nth-child(3), .gr:nth-child(3) .gc:nth-child(2), .gr:nth-child(4) .gc:nth-child(1) { animation-delay: 90ms; }
  .gr:nth-child(1) .gc:nth-child(5), .gr:nth-child(2) .gc:nth-child(4), .gr:nth-child(3) .gc:nth-child(3), .gr:nth-child(4) .gc:nth-child(2), .gr:nth-child(5) .gc:nth-child(1) { animation-delay: 120ms; }
  .gr:nth-child(2) .gc:nth-child(5), .gr:nth-child(3) .gc:nth-child(4), .gr:nth-child(4) .gc:nth-child(3), .gr:nth-child(5) .gc:nth-child(2) { animation-delay: 150ms; }
  .gr:nth-child(3) .gc:nth-child(5), .gr:nth-child(4) .gc:nth-child(4), .gr:nth-child(5) .gc:nth-child(3) { animation-delay: 180ms; }
  .gr:nth-child(4) .gc:nth-child(5), .gr:nth-child(5) .gc:nth-child(4) { animation-delay: 210ms; }
  .gr:nth-child(5) .gc:nth-child(5) { animation-delay: 240ms; }

  .gc:last-child {
    margin-right: 0;
  }

  .guide-center {
    background-size: 14px 14px;
    background-repeat: no-repeat;
    background-position: center;
  }

  #story {
    width: 100%;
    background-color: rgba(255, 255, 255, 0.144);
    color: #9f9f9f;
    padding: 4px;
  }
</style>
</html>
