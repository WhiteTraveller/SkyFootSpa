<!doctype html>
<!--
  遗物 tooltip：标题栏 + 左侧描述面板（上/中×N/下，N=遗物 tooltipHeight）+ 右侧引导网格方框。
  素材按设计稿 1111×470 的 25/48 预缩放到 CSS 尺寸：tooltip_header 579×57、tooltip_desc_* 394 宽（中段 108 高）、tooltip_guide 180×180。
-->
<html>
<head>
  <meta charset="utf-8">
  <meta name="aui-font-mode" content="web">
  <meta name="aui-viewport" content="mode=browser">
</head>
<body>
  <div id="tooltip">
    <div id="header">
        <span id="title"></span>
    </div>
    <div id="content">
      <div id="desc-panel">
        <div id="desc-top"></div>
        <div id="desc-mid"></div>
        <div id="desc-bottom"></div>
        <div id="desc-area">
          <div id="main-desc">
            <span id="main-desc-text"></span>
          </div>
          <div id="sub-desc">
            <span id="sub-desc-text"></span>
          </div>
          <div id="story">
            <span id="story-text"></span>
          </div>
        </div>
      </div>
      <div id="guide-area">
        <div id="guide-grid">
          <div class="gr"><div class="gc" id="guide-cell-0"></div><div class="gc" id="guide-cell-1"></div><div class="gc" id="guide-cell-2"></div><div class="gc" id="guide-cell-3"></div><div class="gc" id="guide-cell-4"></div></div>
          <div class="gr"><div class="gc" id="guide-cell-5"></div><div class="gc" id="guide-cell-6"></div><div class="gc" id="guide-cell-7"></div><div class="gc" id="guide-cell-8"></div><div class="gc" id="guide-cell-9"></div></div>
          <div class="gr"><div class="gc" id="guide-cell-10"></div><div class="gc" id="guide-cell-11"></div><div class="gc" id="guide-cell-12"></div><div class="gc" id="guide-cell-13"></div><div class="gc" id="guide-cell-14"></div></div>
          <div class="gr"><div class="gc" id="guide-cell-15"></div><div class="gc" id="guide-cell-16"></div><div class="gc" id="guide-cell-17"></div><div class="gc" id="guide-cell-18"></div><div class="gc" id="guide-cell-19"></div></div>
          <div class="gr"><div class="gc" id="guide-cell-20"></div><div class="gc" id="guide-cell-21"></div><div class="gc" id="guide-cell-22"></div><div class="gc" id="guide-cell-23"></div><div class="gc" id="guide-cell-24"></div></div>
        </div>
        <div id="guide-icon"></div>
      </div>
    </div>
  </div>
</body>

<style>
  html, body {
    image-rendering: pixelated;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    opacity: 1;
    pointer-events: none;
  }

  body.shown {
    animation: tooltip-fade-in 0.15s ease-out forwards;
  }

  body.hiding {
    animation: tooltip-fade-out 0.15s ease forwards;
  }

  @keyframes tooltip-fade-in {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes tooltip-fade-out {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* translateZ 决定跨 Document 叠放（stamina_hud 用 -1000 与之对称），不可删 */
  #tooltip {
    position: fixed;
    /* 默认在屏幕外，悬停时由 tooltip.js 内联 left/top 覆盖 */
    left: -9999px;
    top: -9999px;
    font-family: "default";
    font-size: 24px;
    transform: translateZ(1000px);
    width: 579px;
    margin-left: 11px;
    display: flex;
    flex-direction: column;
  }

  #header {
    width: 579px;
    height: 57px;
    flex-grow: 0;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    box-sizing: border-box;
    /* 避开左端旋纹装饰 */
    padding-left: 58px;
    background-image: url(tooltip_header.png);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    color: #8e3212;
    margin-bottom: 7px;
  }

  #title {
    white-space: nowrap;
  }

  #content {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
  }

  #desc-panel {
    position: relative;
    width: 394px;
    flex-grow: 0;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }

  #desc-top {
    width: 394px;
    height: 43px;
    flex-grow: 0;
    flex-shrink: 0;
    background-image: url(tooltip_desc_top.png);
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }

  /* 高度由 tooltip.js 按 tooltipHeight × 108 写入；中段素材纵向均匀，拉伸与平铺 N 张等效 */
  #desc-mid {
    width: 394px;
    height: 216px;
    flex-grow: 0;
    flex-shrink: 0;
    background-image: url(tooltip_desc_mid.png);
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }

  #desc-bottom {
    width: 394px;
    height: 31px;
    flex-grow: 0;
    flex-shrink: 0;
    background-image: url(tooltip_desc_bottom.png);
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }

  /* 文本绝对定位叠在面板图上，起始高度可压进上段装饰区 */
  #desc-area {
    position: absolute;
    left: 0;
    top: 32px;
    width: 394px;
    box-sizing: border-box;
    padding-left: 26px;
    padding-right: 19px;
    z-index: 1;
    display: flex;
    flex-direction: column;
    color: #4a2a1a;
  }

  #main-desc {
    line-height: 25px;
    margin-bottom: 6px;
  }

  #sub-desc {
    line-height: 25px;
    color: #7b5640;
    margin-bottom: 6px;
  }

  #story {
    line-height: 25px;
    color: #a08670;
  }

  #guide-area {
    position: relative;
    width: 180px;
    height: 180px;
    flex-grow: 0;
    flex-shrink: 0;
    margin-left: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: url(tooltip_guide.png);
    background-size: 100% 100%;
    background-repeat: no-repeat;
  }

  #guide-grid {
    display: flex;
    flex-direction: column;
  }

  .gr {
    display: flex;
    flex-direction: row;
    margin-bottom: 3px;
  }

  .gr:last-child {
    margin-bottom: 0;
  }

  .gc {
    width: 22px;
    height: 22px;
    margin-right: 3px;
    background-color: rgba(142, 50, 18, 0.15);
  }

  .gc:last-child {
    margin-right: 0;
  }

  /* 遗物贴图为中心格 1.5 倍（33px），单独一层盖在网格中心，允许压住相邻格 */
  #guide-icon {
    position: absolute;
    left: 73px;
    top: 73px;
    width: 33px;
    height: 33px;
    z-index: 1;
    background-size: 33px 33px;
    background-repeat: no-repeat;
  }
</style>
</html>
