<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="aui-font-mode" content="web">
  <meta name="aui-viewport" content="mode=fixed,width=120,height=100">
  <meta name="aui-mouse-events" content="intercept">
</head>
<body>
  <div class="soak-container" id="soakContainer">
    <div class="bg"></div>
    <!-- 桶点击区域：桶贴图16x16放大3倍=48x48 -->
    <div class="button-layer" id="soakBtn">
      <img id="bucketImg" class="bucket-img" src="bucket_empty.png" />
    </div>
    <!-- 文字区域：未泡脚引导文案两行，泡脚中改为单行「泡脚中」 -->
    <div class="text-layer">
      <span class="tips tips-line1" id="soakText1">在工作盆内放入泡脚水</span>
      <span class="tips tips-line2" id="soakText2">进行泡脚</span>
      <!-- 泡脚进度条（常驻DOM，通过opacity+width+innerText控制视觉显隐） -->
      <div class="progress-wrapper" id="progressWrapper" style="opacity: 0">
        <span class="progress-bg">
          <span class="progress-fill" id="progressFill" style="width: 0%"></span>
        </span>
        <span class="progress-text" id="progressText"></span>
      </div>
    </div>
  </div>
</body>

<style>
  html, body {
    image-rendering: crisp-edges;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  .soak-container {
    position: relative;
    width: 120px;
    height: 100px;
    overflow: hidden;
    box-sizing: border-box;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .bg {
    position: absolute;
    left: 0;
    top: 0;
    background: url('soak_basin.png') center/contain no-repeat;
    width: 120px;
    height: 100px;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
  }

  /* 桶点击区域 */
  .button-layer {
    position: absolute;
    left: 36px;
    top: 6px;
    width: 48px;
    height: 48px;
    overflow: hidden;
    pointer-events: auto;
    cursor: pointer;
    z-index: 2;
  }

  .bucket-img {
    display: block;
    width: 48px;
    height: 48px;
    image-rendering: pixelated;
    pointer-events: none;
  }

  /* 文字区域 */
  .text-layer {
    position: absolute;
    left: 0;
    top: 0;
    width: 120px;
    height: 100px;
    justify-content: center;
    overflow: hidden;
    pointer-events: none;
    z-index: 3;
  }

  .tips {
    position: absolute;
    left: 0;
    width: 120px;
    height: 10px;
    display: block;
    font-size: 7px;
    text-align: center;
    color: #6b4226;
    white-space: nowrap;
    line-height: 10px;
  }

  .tips-line1 {
    top: 58px;
  }

  .tips-line2 {
    top: 69px;
  }

  /* 泡脚进度条（横向） */
  .progress-wrapper {
    position: absolute;
    left: 28px;
    top: 85px;
    width: 64px;
    height: 8px;
  }

  .progress-bg {
    position: absolute;
    left: 0;
    width: 46px;
    height: 5px;
    background-color: rgba(107, 66, 38, 0.35);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    background: #b0561f;
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  .progress-text {
    position: absolute;
    left: 50px;
    top: 0;
    width: 14px;
    text-align: left;
    color: #6b4226;
    font-size: 6px;
    white-space: nowrap;
  }
</style>

<script>
  console.log("footsoak.html loaded");
</script>
</html>
