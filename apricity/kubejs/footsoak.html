<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="aui-font-mode" content="web">
  <meta name="aui-viewport" content="mode=fixed,width=120,height=100">
  <meta name="aui-mouse-events" content="intercept">
</head>
<body>
  <div class="soak-container" id="soakContainer">
    <div class="bg"></div>
    <!-- 按钮区域 -->
    <div class="button-layer" id="buttonLayer">
      <button id="soakBtn" class="soakBtn"></button>
    </div>
    <!-- 文字区域 -->
    <div class="text-layer">
      <span class="title" id="mainTitle"></span>
      <span class="tips" id="tipsText"></span>
      <!-- 泡脚进度条（常驻DOM，通过opacity+width+innerText控制视觉显隐） -->
      <div class="progress-wrapper" id="progressWrapper" style="opacity: 0">
        <span class="progress-bg">
          <span class="progress-fill" id="progressFill" style="width: 0%"></span>
        </span>
        <span class="progress-text" id="progressText"></span>
      </div>
    </div>
  </div>
</body>

<style>
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  .soak-container {
    position: relative;
    width: 120px;
    height: 100px;
    overflow: hidden;
    box-sizing: border-box;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  .soak-container.active {

  }

  .bg {
    position: absolute;
    left: 0;
    top: 0;
    background: url('soak1.png') center/contain no-repeat;
    width: 120px;
    height: 100px;
    overflow: hidden;
    align-items: center;
    justify-content: center;
    z-index: 0;
    pointer-events: none;
  }

  /* 按钮区域 */
  .button-layer {
    position: absolute;
    left: 37px;
    top: 12px;
    width: 46px;
    height: 46px;
    overflow: hidden;
    pointer-events: auto;
  }


  .soakBtn {
    position: relative;
    width: 46px;
    height: 46px;
    cursor: pointer;
    background: url('botton.png') center/contain no-repeat;
    border: 0;
    padding: 0;
    transition: transform 0.3s ease-in-out;
    pointer-events: auto;
  }
  .soakBtn.active {
    transform: scale(0.85);
  }

  /* 文字区域 */
  .text-layer {
    position: absolute;
    left: 0;
    top: 0;
    width: 120px;
    height: 100px;
    justify-content: center;
    overflow: hidden;
    pointer-events: none;
  }

  .title {
    position: absolute;
    left: 0;
    top: 61px;
    width: 120px;
    height: 12px;
    display: block;
    text-align: center;
    font-size: 8px;
    font-weight: bold;
    color: #ffffff;
    white-space: nowrap;
    line-height: 12px;
  }

  .title.active {
    color: #ffffff;
  }

  .tips {
    position: absolute;
    left: 0;
    top: 74px;
    width: 120px;
    height: 11px;
    display: block;
    font-size: 7px;
    text-align: center;
    color: #ffffff;
    white-space: nowrap;
    line-height: 11px;
  }

  .tips.active {
    color: #ffffff;
  }

  .tips.hidden {
    display: none;
  }

  /* 泡脚进度条（横向） */
  .progress-wrapper {
    position: absolute;
    left: 28px;
    top: 87px;
    width: 64px;
    height: 8px;
  }

  .progress-wrapper.hidden {
    display: none;
  }

  .progress-bg {
    position: absolute;
    left: 0;
    width: 46px;
    height: 5px;
    background-color: rgba(80, 80, 80, 0.7);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 100%;
    background: #ffffff;
    border-radius: 2px;
    transition: width 0.1s linear;
  }

  .progress-text {
    position: absolute;
    left: 50px;
    top: 0;
    width: 14px;
    text-align: left;
    color: #ffffff;
    font-size: 6px;
    white-space: nowrap;
  }
</style>

<script>
  console.log("footsoak.html loaded");
</script>
</html>
